<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nailzw.Gigi | Custom Press-On Nails</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff;
      color: #222;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid #eee;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    nav a {
      margin-left: 18px;
      text-decoration: none;
      color: #222;
      font-weight: 600;
    }

    .hero {
      min-height: 82vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 70px 20px;
      background: linear-gradient(135deg, #fff, #fce8f2, #f5eefc);
    }

    .hero h1 {
      font-size: clamp(45px, 9vw, 90px);
      margin-bottom: 15px;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      font-size: 18px;
      line-height: 1.6;
    }

    .buttons {
      margin-top: 30px;
    }

    .button {
      display: inline-block;
      padding: 14px 25px;
      margin: 6px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: 700;
      background: #222;
      color: white;
    }

    .button.light {
      background: white;
      color: #222;
      border: 1px solid #222;
    }

    section {
      padding: 80px 7%;
      text-align: center;
    }

    section h2 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    .subtitle {
      max-width: 650px;
      margin: 0 auto 40px;
      line-height: 1.6;
      color: #666;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
      max-width: 1000px;
      margin: auto;
    }

    .card {
      padding: 30px 20px;
      border: 1px solid #eee;
      border-radius: 20px;
      background: white;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }

    .card h3 {
      margin-bottom: 12px;
    }

    .sizing {
      background: #faf6fb;
    }

    form {
      max-width: 700px;
      margin: auto;
      text-align: left;
      background: white;
      padding: 30px;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.07);
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: 700;
    }

    input, textarea, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .submit {
      width: 100%;
      border: none;
      margin-top: 25px;
      cursor: pointer;
      font-size: 16px;
    }

    .gallery {
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: #f5f5f5;
      color: #777;
    }

    footer {
      padding: 35px 20px;
      text-align: center;
      background: #222;
      color: white;
    }

    @media (max-width: 650px) {
      header {
        flex-direction: column;
        gap: 12px;
      }

      nav a {
        margin: 0 7px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">NAILZW.GIGI ✨
